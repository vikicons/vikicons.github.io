name: Auto Update News from Baoxaydung RSS

on:
  schedule:
    - cron: "0 22,10 * * *" # 22:00 và 10:00 UTC = 05:00 và 17:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install feedparser beautifulsoup4

      - name: Update home page news (5 bản tin trang chủ)
        run: python scripts/update_news.py

      - name: Update all news (trang Tin tức và các mục con)
        run: python scripts/update_all_news.py

      - name: Commit and push updated JSON
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/latest_news.json src/data/all_news.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Không có thay đổi, bỏ qua deploy."
          else
            git commit -m "chore: auto-update news json from rss"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update-news
    if: needs.update-news.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
