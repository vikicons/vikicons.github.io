name: Auto Update All News from Baoxaydung RSS

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  update-all-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install feedparser beautifulsoup4

      - name: Run Python script
        run: python scripts/update_all_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/all_news.json
          git commit -m "chore: auto-update all news json from baoxaydung rss [skip ci]" || echo "No changes"
          git push
